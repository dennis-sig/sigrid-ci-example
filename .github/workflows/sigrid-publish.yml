name: Publish to Sigrid
on:
  push:
    branches:
      - main
      - master

jobs:
  sigridci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sigrid CI
        uses: Software-Improvement-Group/sigridci@consolidated-feedback
        with:
          customer: sigdelivery
          system: sigrid-ci-example-dennis
          publishonly: true
        env:
          SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"
