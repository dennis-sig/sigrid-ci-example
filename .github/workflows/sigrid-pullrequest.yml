name: Sigrid pull request feedback
on: [pull_request]

jobs:
  sigridci:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Sigrid CI
        run: "git clone -b osh-vulnerability-details https://github.com/Software-Improvement-Group/sigridci.git sigridci"
      - name: "Run Sigrid CI" 
        env:
          SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"
        run: "./sigridci/sigridci/sigridci.py --customer sigdelivery --system github-sigrid-ci-example --source . --capability maintainability,osh && find sigrid-ci-output -iname 'osh*.json' -exec cat {} \\;"
      #- name: Sigrid CI
      #  uses: Software-Improvement-Group/sigridci@osh-vulnerability-details
      #  with:
      #    customer: sigdelivery
      #    system: github-sigrid-ci-example
      #    capability: maintainability,osh
      #  env:
      #    SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"
      - name: "Sigrid pull request feedback"
        uses: mshick/add-pr-comment@v2
        if: always()
        with:
          message-id: sigrid
          message-path: sigrid-ci-output/*feedback.md
